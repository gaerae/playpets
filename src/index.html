              <label class="volume-row"><span data-i18n="settings.volume"></span><input type="range" id="sound-volume" min="0" max="100" step="5"></label>
            </section>
            <section class="settings-section" aria-labelledby="agent-link-title">
              <h3 id="agent-link-title" data-i18n="settings.agents"></h3>
              <p class="settings-lead" data-i18n="settings.agents_lead"></p>
              <ul class="link-list">
                <li class="link-row">
                  <div>
                    <strong>Claude Code <span class="badge" data-i18n="settings.recommended"></span></strong><small><code data-agent-file="claude">~/.claude/settings.json</code><span data-i18n="settings.each_step"></span></small>
                  </div>
                  <label class="agent-pet"><span data-i18n="settings.agent_pet"></span><select class="language-select" data-agent="claude"></select></label><button id="copy-claude" class="button secondary small" data-kind="claude" data-i18n="settings.copy"></button>
                </li>
                <li class="link-row">
                  <div>
                    <strong>Codex CLI</strong><small><code data-agent-file="codex">~/.codex/config.toml</code><span data-i18n="settings.codex_note"></span></small>
                  </div>
                  <label class="agent-pet"><span data-i18n="settings.agent_pet"></span><select class="language-select" data-agent="codex"></select></label><button id="copy-codex" class="button secondary small" data-kind="codex" data-i18n="settings.copy"></button>
                </li>
                <li class="link-row">
                  <div>
                    <strong>Gemini CLI</strong><small><code data-agent-file="gemini">~/.gemini/settings.json</code><span data-i18n="settings.each_step"></span></small>
                  </div>
                  <label class="agent-pet"><span data-i18n="settings.agent_pet"></span><select class="language-select" data-agent="gemini"></select></label><button id="copy-gemini" class="button secondary small" data-kind="gemini" data-i18n="settings.copy"></button>
                </li>
                <li class="link-row">
                  <div>
                    <strong>Cursor</strong><small><code data-agent-file="cursor">~/.cursor/hooks.json</code><span data-i18n="settings.cursor_note"></span></small>
                  </div>
                  <label class="agent-pet"><span data-i18n="settings.agent_pet"></span><select class="language-select" data-agent="cursor"></select></label><button id="copy-cursor" class="button secondary small" data-kind="cursor" data-i18n="settings.copy"></button>
                </li>
                <li class="link-row">
                  <div>
                    <strong data-i18n="settings.mcp"></strong><small data-i18n="settings.mcp_note"></small>
                  </div>
                  <label class="agent-pet"><span data-i18n="settings.agent_pet"></span><select class="language-select" data-agent="mcp"></select></label><button id="copy-mcp" class="button secondary small" data-kind="mcp" data-i18n="settings.copy"></button>
                </li>
              </ul>
              <p class="tiny" data-i18n="settings.privacy"></p>
            </section>
            <section class="settings-section about" aria-labelledby="about-title">
              <h3 id="about-title" data-i18n="about.title"></h3>
              <p class="settings-lead"><span class="about-name">PlayPets <span id="app-version" class="version"></span></span> <span data-i18n="about.lead"></span></p>
              <ul class="link-list">
                <li class="link-row">
                  <div>
                    <strong data-i18n="settings.update"></strong><small id="update-note"></small>
                  </div>
                  <span class="update-actions"><button id="update-notes" class="button secondary small" data-i18n="settings.update_notes" hidden></button><button id="update-button" class="button secondary small" data-i18n="settings.update_check"></button></span>
                </li>
              </ul>
              <div class="about-links">
                <button class="button secondary small" data-link="site" data-i18n="about.site"></button><button class="button secondary small" data-link="guide" data-i18n="about.guide"></button><button class="button secondary small" data-link="releases" data-i18n="about.releases"></button><button class="button secondary small" data-link="github" data-i18n="about.github"></button><button class="button secondary small" data-link="report" data-i18n="about.report"></button><button class="button secondary small" data-link="license" data-i18n="about.license"></button>
              </div>
            </section>
            <div class="app-row">
              <button id="quit-app" class="button secondary quit"><span data-icon="power"></span><span data-i18n="settings.quit"></span></button>
            </div>
          </div>
        </aside>
      </main>
    </div>
    <dialog id="pet-dialog" aria-labelledby="pet-dialog-name">
      <form id="pet-form">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow" data-i18n="friend.settings"></p>
            <h2 id="pet-dialog-name" data-i18n="tabs.friend"></h2>
          </div>
          <button type="button" id="close-pet-dialog" class="icon-button" data-i18n-aria-label="common.close"><span data-icon="close"></span></button>
        </div>
        <label for="pet-name" data-i18n="pet.name"></label><input id="pet-name" maxlength="24" data-i18n-placeholder="pet.name_placeholder"><label for="pet-persona" data-i18n="pet.persona"></label>
        <textarea id="pet-persona" maxlength="400" rows="4" data-i18n-placeholder="pet.persona_placeholder"></textarea>
        <small id="persona-help" data-i18n="pet.persona_help"></small><button type="button" id="use-intro" class="button chip intro-chip" data-i18n="pet.use_intro" hidden></button>
        <div class="relation-row">
          <div>
            <label for="pet-relation" data-i18n="pet.relation"></label>
            <select id="pet-relation" class="language-select"><option value="" data-i18n="relation.friend"></option><option value="partner" data-i18n="relation.partner"></option><option value="senior" data-i18n="relation.senior"></option><option value="junior" data-i18n="relation.junior"></option></select>
          </div>
          <div>
            <label for="pet-call-me" data-i18n="pet.call_me"></label>
            <input id="pet-call-me" maxlength="24" data-i18n-placeholder="pet.call_me_placeholder">
          </div>
        </div>
        <small data-i18n="pet.relation_help"></small><label for="size-range" data-i18n="pet.size"></label>
        <div class="size-row">
          <input id="size-range" type="range" min="64" max="192" step="32" list="size-steps">
          <datalist id="size-steps"><option value="64"></option><option value="96"></option><option value="128"></option><option value="160"></option><option value="192"></option></datalist>
          <output id="size-label" for="size-range" data-i18n="size.m"></output>
        </div>
        <small data-i18n="pet.size_help"></small><code id="instance-id" class="pet-id"></code>
        <p id="pet-error" class="form-error" role="alert"></p>
        <div class="dialog-actions">
          <button type="button" id="remove" class="button text danger push-left"><span data-icon="logout"></span><span data-i18n="friend.send_away_long"></span></button><button type="button" id="cancel-pet-dialog" class="button text" data-i18n="confirm.cancel"></button><button type="submit" class="button primary" data-i18n="common.save"></button>
        </div>
      </form>
    </dialog>
    <dialog id="import-dialog" aria-labelledby="import-title">
      <form id="import-form">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow" data-i18n="invite.community"></p>
            <h2 id="import-title" data-i18n="invite.import"></h2>
          </div>
          <button type="button" id="close-import" class="icon-button" data-i18n-aria-label="common.close"><span data-icon="close"></span></button>
        </div>
        <p class="dialog-description" data-i18n="invite.import_lead"></p>
        <label for="import-url" data-i18n="invite.url"></label><input id="import-url" type="url" required autocomplete="off" data-i18n-placeholder="invite.url_placeholder">
        <p id="import-error" class="form-error" role="alert"></p>
        <p class="tiny" data-i18n="invite.browse"></p>
        <div id="community-links" class="community-links">
        </div>
        <div class="dialog-actions">
          <button type="button" id="import-folder" class="button text push-left"><span data-icon="folder"></span><span data-i18n="invite.from_folder"></span></button><button type="button" id="cancel-import" class="button text" data-i18n="confirm.cancel"></button><button type="submit" id="import-submit" class="button primary" data-i18n="invite.import_go"></button>
        </div>
      </form>
    </dialog>
    <dialog id="connection-dialog" aria-labelledby="dialog-title">
      <form id="connection-form">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow" data-i18n="connection.eyebrow"></p>
            <h2 id="dialog-title" data-i18n="connection.title_new"></h2>
          </div>
          <button type="button" id="close-dialog" class="icon-button" data-i18n-aria-label="common.close"><span data-icon="close"></span></button>
        </div>
        <p class="dialog-description" data-i18n="connection.lead"></p>
        <fieldset id="ai-types" class="ai-types">
          <legend data-i18n="connection.type"></legend>
          <label class="ai-type" data-type="claude"><input type="radio" name="ai-type" value="claude"><span class="ai-type-name">Claude Code</span><small data-i18n="connection.about_claude"></small><span class="ai-found" data-i18n="connection.found" hidden></span></label><label class="ai-type" data-type="codex"><input type="radio" name="ai-type" value="codex"><span class="ai-type-name">Codex CLI</span><small data-i18n="connection.about_codex"></small><span class="ai-found" data-i18n="connection.found" hidden></span></label><label class="ai-type" data-type="ollama"><input type="radio" name="ai-type" value="ollama"><span class="ai-type-name">Ollama</span><small data-i18n="connection.about_ollama"></small><span class="ai-found" data-i18n="connection.found" hidden></span></label><label class="ai-type" data-type="openai"><input type="radio" name="ai-type" value="openai"><span class="ai-type-name">OpenAI API</span><small data-i18n="connection.about_openai"></small><span class="ai-found" data-i18n="connection.found" hidden></span></label><label class="ai-type" data-type="compatible"><input type="radio" name="ai-type" value="compatible"><span class="ai-type-name" data-i18n="connection.type_compatible"></span><small data-i18n="connection.about_compatible"></small><span class="ai-found" data-i18n="connection.found" hidden></span></label>
        </fieldset>
        <div id="type-fields">
          <div id="endpoint-field" hidden>
            <label for="ai-endpoint"><span data-i18n="connection.endpoint"></span><span class="req">*</span></label><input id="ai-endpoint" type="url" placeholder="https://your-server.example/v1">
          </div>
          <div id="key-field">
            <label for="ai-key"><span data-i18n="connection.key"></span><span class="req">*</span></label><input id="ai-key" type="password" autocomplete="off" data-i18n-placeholder="connection.key_placeholder"><small data-i18n="connection.key_note"></small>
          </div>
          <label for="ai-model"><span data-i18n="connection.model"></span><span id="model-req" class="req" hidden>*</span></label><input id="ai-model" required maxlength="200" data-i18n-placeholder="connection.model_placeholder" list="model-list" autocomplete="off">
          <datalist id="model-list"></datalist>
          <small id="model-status" class="model-status"></small>
          <p id="provider-note" class="tiny" data-i18n="connection.note_compatible"></p>
        </div>
        <label id="share-all-field" class="wander-toggle share-all" hidden><input type="checkbox" id="ai-share-all"><span class="wander-switch" aria-hidden="true"></span><span id="ai-share-all-label"></span></label>
        <p id="connection-error" class="form-error" role="alert"></p>
        <div class="dialog-actions">
          <button type="button" id="delete-provider" class="button text danger" data-i18n="connection.delete" hidden></button><button type="button" id="cancel-dialog" class="button text" data-i18n="confirm.cancel"></button><button type="submit" id="save-provider" class="button primary" data-i18n="connection.save_new"></button>
        </div>
      </form>
    </dialog>
    <dialog id="update-dialog" class="confirm-dialog update-dialog" aria-labelledby="update-title" aria-describedby="update-body">
      <h2 id="update-title"></h2>
      <p id="update-body" class="dialog-description"></p>
      <button type="button" id="update-dialog-notes" class="button text notes-link" data-i18n="settings.update_notes"></button>
      <div id="update-progress-wrap" class="update-progress" hidden><progress id="update-progress" max="100" value="0"></progress><small id="update-progress-label"></small></div>
      <div class="dialog-actions">
        <button type="button" id="update-later" class="button text" data-i18n="update.later"></button><button type="button" id="update-install" class="button primary" data-i18n="settings.update_install"></button>
      </div>
    </dialog>
    <dialog id="album-dialog" class="album-dialog" aria-labelledby="album-title">
      <div class="dialog-heading">
        <div>
          <h2 id="album-title" data-i18n="catch.album_heading"></h2>
          <p id="album-total" class="album-total"></p>
        </div>
        <button type="button" id="close-album" class="icon-button" data-i18n-aria-label="common.close"><span data-icon="close"></span></button>
      </div>
      <p class="dialog-description" data-i18n="catch.album_lead"></p>
      <div class="album-tabs" role="tablist">
        <button type="button" role="tab" data-book="flower" aria-selected="true" aria-controls="album-grid"><span data-i18n="catch.tab_flowers"></span><small data-count="flower"></small></button><button type="button" role="tab" data-book="fish" aria-selected="false" aria-controls="album-grid"><span data-i18n="catch.tab_fish"></span><small data-count="fish"></small></button><button type="button" role="tab" data-book="bug" aria-selected="false" aria-controls="album-grid"><span data-i18n="catch.tab_bugs"></span><small data-count="bug"></small></button><button type="button" role="tab" data-book="gift" aria-selected="false" aria-controls="album-grid"><span data-i18n="catch.tab_gifts"></span><small data-count="gift"></small></button>
      </div>
      <div id="album-grid" class="album-grid" role="tabpanel"></div>
    </dialog>
    <dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-body">
      <h2 id="confirm-title"></h2>
      <p id="confirm-body" class="dialog-description"></p>
      <div class="dialog-actions">
        <button type="button" id="confirm-cancel" class="button text" data-i18n="confirm.cancel"></button><button type="button" id="confirm-ok" class="button primary"></button>
      </div>
    </dialog>
    <script type="module" src="app.js"></script>
  </body>
</html>
