          <button type="button" id="delete-provider" class="button text danger" data-i18n="connection.delete" hidden></button><button type="button" id="cancel-dialog" class="button text" data-i18n="confirm.cancel"></button><button type="submit" id="save-provider" class="button primary" data-i18n="connection.save_new"></button>
        </div>
      </form>
    </dialog>
    <button id="update-compact" type="button" class="update-compact" aria-controls="update-dialog" aria-expanded="false" hidden><span data-icon="download"></span><span id="update-compact-label" class="sr-only"></span></button>
    <dialog id="album-dialog" class="album-dialog" aria-labelledby="album-title">
      <div class="dialog-heading">
        <div>
          <h2 id="album-title" data-i18n="catch.album_heading"></h2>
          <p id="album-total" class="album-total"></p>
        </div>
        <div class="album-heading-actions">
          <button type="button" id="close-album" class="icon-button" data-i18n-aria-label="common.close"><span data-icon="close"></span></button>
        </div>
      </div>
      <p class="dialog-description" data-i18n="catch.album_lead"></p>
      <label class="album-picker"><span data-i18n="album.category"></span><select id="album-select"></select></label>
      <div id="album-tabs" class="album-tabs" role="tablist"></div>
      <p id="album-dig-status" class="album-dig-status" hidden></p>
      <div id="album-grid" class="album-grid" role="tabpanel" tabindex="0"></div>
    </dialog>
    <dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-body">
      <h2 id="confirm-title"></h2>
      <p id="confirm-body" class="dialog-description"></p>
      <div class="dialog-actions">
        <button type="button" id="confirm-cancel" class="button text" data-i18n="confirm.cancel"></button><button type="button" id="confirm-ok" class="button primary"></button>
      </div>
    </dialog>
    <script type="module" src="app.js"></script>
  </body>
</html>
