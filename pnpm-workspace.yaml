# pnpm's settings for this repository, which is one package at the root (no `packages:`).
# pnpm reads only registry and auth settings from .npmrc; everything else lives here.

# Stop before installation when Node or pnpm cannot run this project's tooling.
engineStrict: true
# New direct dependencies record the chosen version; `pnpm install --frozen-lockfile` uses the lockfile.
saveExact: true

# Dependencies' install scripts never run: a compromised package cannot run code on install. Each
# package with a script is listed here as reviewed; a new one fails the install (strictDepBuilds,
# on by default) until someone decides. Neither needs its script: esbuild finds its binary through
# its optional platform package, and fsevents ships a prebuilt one.
allowBuilds:
  esbuild: false
  fsevents: false

# A version newer than a day is not installed when the lockfile is resolved again. Dependabot waits
# a week for routine updates only (.github/dependabot.yml); this day holds for its security updates
# too, so one for a fix released today fails until tomorrow. To take an urgent fix at once, list the
# package under minimumReleaseAgeExclude and remove it once the fixed version is a day old.
minimumReleaseAge: 1440

# The site's build tools have no known advisories (docs/how-to/website.md says when to drop these).
overrides:
  # The pinned VitePress 1.6.4 still asks for vite 5, whose dev server has known advisories.
  vite: ^6.4.3
  # Pulled in by mermaid.
  katex: ^0.19.0
