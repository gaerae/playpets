# Monthly update PRs for each kind of dependency: each PR builds on every platform, and few
# updates are urgent. Security updates come at once, whatever this schedule says.
# Minor and patch updates of each kind come as one PR, so CI checks them together; major updates
# come one by one. A PR that changes Cargo.lock needs `pnpm run licenses:generate` on its branch.
# A version is proposed only a week after its release, time for a hijacked release to be found and
# pulled. Cooldown delays version updates only: security updates come at once, and Dependabot lifts
# pnpm's minimumReleaseAge for them too, though CI still waits that day (SECURITY.md).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      rust:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      # vite 6 accepts esbuild ^0.25.0 only (docs/how-to/website.md).
      - dependency-name: 'esbuild'
        versions: ['>=0.26.0']
      # Biome 2.6 crashes on Windows on Arm (docs/standards/page-modules.md).
      - dependency-name: '@biomejs/biome'
        versions: ['>=2.6.0']
    groups:
      npm:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
  # The local Docker builds (pnpm run dist:linux / dist:windows). They keep Dependabot's default 3
  # days: the official Node and Rust images are rebuilt mostly for fixes, and no release uses them.
  - package-ecosystem: docker
    directories: [/packaging/linux, /packaging/windows]
    schedule:
      interval: monthly
