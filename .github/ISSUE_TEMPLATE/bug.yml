name: Bug report
description: Tell us about something that does not work the way you expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Tell us what you did, what you expected, and what actually happened.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PlayPets version
      description: It is at the bottom of the Settings tab.
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or error messages
