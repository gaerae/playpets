# Builds the website (website/ plus a copy of docs/) and publishes it to GitHub Pages.
# The repository's Pages source must be set to "GitHub Actions" once.
name: pages

on:
  push:
    branches: [main]
    paths: [packaging/licenses/**, website/**, docs/**, assets/**, src/art/**, src/core/animation.js, src/core/season.js, src/yard/background-pack.js, src-tauri/icons/**, CHANGELOG.md, scripts/**, .node-version, pnpm-workspace.yaml, package.json, pnpm-lock.yaml, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

# A deploy in progress finishes; a newer push waits for it instead of cutting it off.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # configure-pages reads the repository's Pages settings.
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The download buttons name the files of the published releases; the token reads them
      # without the anonymous rate limit. distribute.yml runs this again when a release is published.
      - run: pnpm run site:build
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
