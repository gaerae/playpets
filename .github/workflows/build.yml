# Builds the Tauri app on every desktop platform and runs the real-app e2e on each runner.
# Actions are pinned to a commit, with the version as a comment; Dependabot moves both together.
# dtolnay/rust-toolchain has no release tags, so it is pinned to its stable branch and refreshed by hand.
name: build

on:
  # The ruleset merges a PR only on top of the latest main and after this workflow passed, so main
  # already holds a tested tree. It builds again only to refresh the Rust cache that PRs restore: when
  # the crates change, and on Fridays for the Rust version, the morning after a Thursday stable release.
  push:
    branches: [main]
    paths: [src-tauri/Cargo.lock, src-tauri/Cargo.toml, .github/workflows/build.yml]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '47 4 * * 5'

permissions:
  contents: read

# A newer push to the same branch or PR replaces a run still in progress.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # A dmg, not the .app folder: artifacts drop file permissions, and a downloaded .app
          # would lose its executable bit.
          - {os: macos-latest, name: macos-arm64, bundles: "app,dmg"}
          - {os: windows-latest, name: windows-x64, bundles: nsis}
          - {os: windows-11-arm, name: windows-arm64, bundles: nsis}
          - {os: ubuntu-22.04, name: linux-x64, bundles: "deb,appimage"}
          - {os: ubuntu-22.04-arm, name: linux-arm64, bundles: "deb,appimage"}
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    timeout-minutes: 90
    # LTO takes most of each link, and this job links up to four times; only the release keeps it
    # (Cargo.toml). Set for the whole job because rust-cache hashes CARGO* variables into its key.
    env:
      CARGO_PROFILE_RELEASE_LTO: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: clippy, rustfmt
      # A PR's cache serves that PR alone yet counts against the repository's limit, where it can
      # push out the caches of main that every PR restores.
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev patchelf xvfb dbus-x11 openbox x11-utils
      - run: pnpm install --frozen-lockfile
      # Layout and lint rules. Each platform has code of its own (macOS panels, the Windows
      # console), so each is checked.
      - name: Lint
        run: pnpm run lint
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: assets/creator-skill/playpets-creator/requirements.txt
      - name: Creator skill image dependency
        run: python -m pip install -r assets/creator-skill/playpets-creator/requirements.txt
      - name: Unit tests
        env:
          PLAYPETS_PYTHON: python
        run: pnpm test
      # Tauri copies this generated tree into AppImages. Build the exact executable first so the
      # collector follows its linked distro libraries rather than maintaining a second package list.
      - name: Collect AppImage system licenses
        if: runner.os == 'Linux'
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml
          node scripts/prepare-appimage-licenses.mjs \
            src-tauri/target/release/playpets \
            src-tauri/target/appimage-license-docs
      - name: Build
        shell: bash
        run: |
          pnpm exec tauri build --bundles ${{ matrix.bundles }}
          if [ "$RUNNER_OS" = "Linux" ]; then
            bundle=src-tauri/target/release/bundle
            node scripts/prepare-appimage-licenses.mjs --appimage \
              "$(ls "$bundle"/appimage/*.AppImage)" \
              src-tauri/target/appimage-license-docs
            pnpm exec tauri build --bundles ${{ matrix.bundles }}
          fi
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          # The release styles the disk image window on CI; doing it here too catches a failure before a tag does.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
      # An app with only the linker's signature (no sealed resources) opens as "damaged" once it
      # is downloaded; the bundle is signed ad hoc (tauri.conf.json signingIdentity "-") until a
      # Developer ID is set up.
      - name: macOS signature
        if: runner.os == 'macOS'
        run: codesign --verify --strict --deep src-tauri/target/release/bundle/macos/PlayPets.app
      # The bundles are made, so the e2e build may take target/release here and reuse the release
      # build's compiled dependencies; a separate profile (test:e2e's target/e2e, which keeps a
      # developer's app in place) would compile and cache all of them a second time.
      - name: Preserve production binary for MSIX activation
        if: runner.os == 'Windows'
        shell: powershell
        run: Copy-Item src-tauri/target/release/playpets.exe "$env:RUNNER_TEMP/playpets-msix-production.exe"
      - name: E2E build
        run: cargo build --release --features e2e --manifest-path src-tauri/Cargo.toml
      - name: E2E (Linux, Xvfb)
        if: runner.os == 'Linux'
        run: bash scripts/linux-e2e.sh node tests/e2e.mjs
        env:
          PLAYPETS_BINARY: ${{ github.workspace }}/src-tauri/target/release/playpets
      - name: E2E
        if: runner.os != 'Linux'
        run: node tests/e2e.mjs
        env:
          PLAYPETS_BINARY: ${{ github.workspace }}/src-tauri/target/release/playpets${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: MSIX install, activation and Store updater gate
        if: runner.os == 'Windows'
        shell: powershell
        run: pnpm run test:msix:ci -ProductionBinary "$env:RUNNER_TEMP/playpets-msix-production.exe" -ProbeBinary "$env:GITHUB_WORKSPACE/src-tauri/target/release/playpets.exe" -Architecture "${{ matrix.name == 'windows-arm64' && 'arm64' || 'x64' }}"
      - name: MSIX verification reports
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msix-verification-${{ matrix.name }}
          path: |
            release/windows/msix-ci/*.json
            release/windows/msix-ci/*.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playpets-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
  # The site and the developer docs: dead links fail the build, so a PR cannot break them.
  site:
    runs-on: ubuntu-latest
    name: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Site build
        run: pnpm run site:build
