# Builds the Tauri app on every desktop platform and runs the real-app e2e on each runner.
# Actions are pinned to a commit, with the version as a comment; Dependabot moves both together.
# dtolnay/rust-toolchain has no release tags, so it is pinned to its stable branch and refreshed by hand.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR replaces a run still in progress.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # A dmg, not the .app folder: artifacts drop file permissions, and a downloaded .app
          # would lose its executable bit.
          - {os: macos-latest, name: macos-arm64, bundles: "app,dmg"}
          - {os: windows-latest, name: windows-x64, bundles: nsis}
          - {os: windows-11-arm, name: windows-arm64, bundles: nsis}
          - {os: ubuntu-22.04, name: linux-x64, bundles: "deb,appimage"}
          - {os: ubuntu-22.04-arm, name: linux-arm64, bundles: "deb,appimage"}
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev patchelf xvfb dbus-x11
      - run: npm ci
      # Layout and lint rules. Each platform has code of its own (macOS panels, the Windows
      # console), so each is checked.
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npx tauri build --bundles ${{ matrix.bundles }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          # The release styles the disk image window on CI; doing it here too catches a failure before a tag does.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
      # An app with only the linker's signature (no sealed resources) opens as "damaged" once it
      # is downloaded; the bundle is signed ad hoc (tauri.conf.json signingIdentity "-") until a
      # Developer ID is set up.
      - name: macOS signature
        if: runner.os == 'macOS'
        run: codesign --verify --strict --deep src-tauri/target/release/bundle/macos/PlayPets.app
      - name: E2E (Linux, Xvfb)
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:e2e
        env:
          # Under Xvfb's software GL, WebKitGTK's DMA-BUF renderer ends the page's web process partway
          # through the run; the shared-memory renderer does not (docs/troubleshooting.md).
          WEBKIT_DISABLE_DMABUF_RENDERER: 1
      - name: E2E
        if: runner.os != 'Linux'
        run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playpets-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
  # The site and the developer docs: dead links fail the build, so a PR cannot break them.
  site:
    runs-on: ubuntu-latest
    name: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Site build
        run: npm run site:build
