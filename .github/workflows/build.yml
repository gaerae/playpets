# Builds the Tauri app on every desktop platform and runs the real-app e2e on each runner.
# Actions are pinned to a commit, with the version as a comment; Dependabot moves both together.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # A dmg, not the .app folder: artifacts drop file permissions, and a downloaded .app
          # would lose its executable bit.
          - {os: macos-latest, name: macos-arm64, bundles: "app,dmg"}
          - {os: windows-latest, name: windows-x64, bundles: nsis}
          - {os: windows-11-arm, name: windows-arm64, bundles: nsis}
          - {os: ubuntu-22.04, name: linux-x64, bundles: "deb,appimage"}
          - {os: ubuntu-22.04-arm, name: linux-arm64, bundles: "deb,appimage"}
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev patchelf xvfb dbus-x11
      - run: npm ci
      # Layout and lint rules. Each platform has code of its own (macOS panels, the Windows
      # console), so each is checked.
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npx tauri build --bundles ${{ matrix.bundles }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
      - name: E2E (Linux, Xvfb)
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:e2e
      - name: E2E
        if: runner.os != 'Linux'
        run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playpets-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
  # The site and the developer docs: dead links fail the build, so a PR cannot break them.
  site:
    runs-on: ubuntu-latest
    name: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
      - run: npm ci
      - name: Site build
        run: npm run site:build
