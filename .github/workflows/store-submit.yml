name: Store certification submission

on:
  workflow_dispatch:
    inputs:
      package_run_id:
        description: Successful Store packages run on main (review its source and SHA-256 report first)
        type: string
        required: true
      release_notes:
        description: JSON with en-us, ko-kr, ja-jp, zh-cn release notes (each at most 1500 characters)
        type: string
        required: true
      confirmation:
        description: Type SUBMIT_FOR_CERTIFICATION to request review; never publishes
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: microsoft-store
  cancel-in-progress: false

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a successful first-party package run and explicit certification request
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN: ${{ inputs.package_run_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRMATION" = SUBMIT_FOR_CERTIFICATION
          [[ "$PACKAGE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGE_RUN" --jq \
            '.conclusion == "success" and .event == "workflow_dispatch" and .head_branch == "main" and .path == ".github/workflows/store-package.yml"' | grep -qx true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: store-bundle
          path: release/store
          run-id: ${{ inputs.package_run_id }}
          github-token: ${{ github.token }}
      - name: Verify source, hashes, package identities and localized notes before approval
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, xml.etree.ElementTree as ET, zipfile
          root = pathlib.Path('release/store')
          record = json.loads((root / 'release.json').read_text())
          version = record['version']
          assert re.fullmatch(r'[1-9][0-9]*\.[0-9]+\.[0-9]+', version)
          assert all(int(part) <= 65535 for part in version.split('.'))
          assert re.fullmatch(r'[a-f0-9]{40}', record['sourceSha'])
          sha = subprocess.check_output(['git', 'rev-parse', f'refs/tags/v{version}^{{commit}}'], text=True).strip()
          assert record['sourceSha'] == sha
          subprocess.run(['git', 'merge-base', '--is-ancestor', sha, 'origin/main'], check=True)
          files = [f'PlayPets_{version}_{arch}.msix' for arch in ('x64', 'arm64')]
          assert record['files'] == files
          assert {path.name for path in root.iterdir()} == set(files + ['release.json'])
          for name, arch in zip(files, ('x64', 'arm64')):
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == record['sha256'][name]
              with zipfile.ZipFile(root / name) as package:
                  assert package.testzip() is None
                  manifest = ET.fromstring(package.read('AppxManifest.xml'))
              identity = manifest.find('{http://schemas.microsoft.com/appx/manifest/foundation/windows10}Identity')
              assert identity.attrib == {'Name': 'gaerae.PlayPets', 'Publisher': 'CN=85817E6E-C9F8-44E1-B251-9010546EC6B8', 'Version': version + '.0', 'ProcessorArchitecture': arch}
          notes = json.loads(os.environ['RELEASE_NOTES'])
          for locale in ('en-us', 'ko-kr', 'ja-jp', 'zh-cn'):
              assert isinstance(notes.get(locale), str) and notes[locale].strip() and len(notes[locale]) <= 1500
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('## Packages awaiting certification approval\n\n```json\n' + json.dumps(record, indent=2) + '\n```\nPublication will remain Manual.\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: approved-store-inputs
          path: |
            release/store/*.msix
            release/store/release.json
          if-no-files-found: error
          retention-days: 14

  submit:
    name: Approve certification request with manual publication hold
    needs: packages
    if: vars.STORE_SUBMISSION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: microsoft-store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: approved-store-inputs
          path: release/store
      - name: Request certification and keep publication on manual hold
        env:
          STORE_SUBMISSION_ENABLED: ${{ vars.STORE_SUBMISSION_ENABLED }}
          STORE_CONFIRMATION: ${{ inputs.confirmation }}
          STORE_RELEASE_NOTES: ${{ inputs.release_notes }}
          STORE_APP_ID: ${{ vars.STORE_APP_ID }}
          STORE_TENANT_ID: ${{ vars.STORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ vars.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
        run: node scripts/store-submit.mjs release/store
