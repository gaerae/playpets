name: Store API verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: microsoft-store
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - run: node --test tests/store-api.test.mjs

  verify:
    name: Approve read-only Store API verification
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: microsoft-store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      # No package installation, cache or third-party script runs with Store credentials.
      - name: Authenticate and read the PlayPets product and publication hold
        env:
          STORE_APP_ID: ${{ vars.STORE_APP_ID }}
          STORE_TENANT_ID: ${{ vars.STORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ vars.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
        run: node scripts/store-api.mjs
