# Sends a published release to Partner Center again with main's submission script, for a fix that
# came after the tag: store.yml runs the tag's own script. The packages are the tag's, from the
# store-bundle artifact of its store run (kept for 14 days), so nothing is built here. Start it from
# main with the tag and that run's ID, after removing any pending submission in Partner Center.
name: store-retry

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag (e.g. v1.4.0)
        required: true
      run:
        description: ID of the tag's store run, which holds its store-bundle artifact
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: microsoft-store
  cancel-in-progress: false

jobs:
  submit:
    name: Submit to Microsoft Store
    if: vars.STORE_SUBMISSION_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: microsoft-store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: store-bundle
          path: release/store
          run-id: ${{ inputs.run }}
          github-token: ${{ github.token }}
      - name: The packages are the ones this tag built
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]] || { echo "Not a release tag" >&2; exit 1; }
          git merge-base --is-ancestor "refs/tags/$TAG" origin/main
          COMMIT="$(git rev-parse "refs/tags/$TAG^{commit}")" node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const release = JSON.parse(readFileSync('release/store/release.json', 'utf8'));
          if (`v${release.version}` !== process.env.TAG) throw new Error('The bundle is another version');
          if (release.sourceSha !== process.env.COMMIT) throw new Error('The bundle came from another commit');
          for (const file of release.files) {
            const hash = createHash('sha256').update(readFileSync(`release/store/${file}`)).digest('hex');
            if (hash !== release.sha256[file]) throw new Error(`${file} changed after it was built`);
          }
          JS
      # No package installation, cache or third-party script runs with Store credentials.
      - name: New submission with both packages and What's new
        env:
          STORE_RELEASE_TAG: ${{ inputs.tag }}
          STORE_SUBMISSION_ENABLED: ${{ vars.STORE_SUBMISSION_ENABLED }}
          STORE_PUBLISH_MODE: ${{ vars.STORE_PUBLISH_MODE }}
          STORE_APP_ID: ${{ vars.STORE_APP_ID }}
          STORE_TENANT_ID: ${{ vars.STORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ vars.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
        run: node scripts/store-submit.mjs release/store
