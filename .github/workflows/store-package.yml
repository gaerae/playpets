name: Store packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable version tag at current main HEAD (v1.0.0 or later)
        required: true
        type: string

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: source
        env:
          TAG: ${{ inputs.tag }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          [[ "$TAG" =~ ^v[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]]
          sha=$(git rev-parse "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$sha" origin/main
          test "$sha" = "$GITHUB_SHA"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  package:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, architecture: x64, target: x86_64-pc-windows-msvc}
          - {os: windows-11-arm, architecture: arm64, target: aarch64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: npm ci --ignore-scripts
      - name: Check tag, changelog and package version
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          test "v$(node -p "require('./package.json').version")" = "$TAG"
          node scripts/release-notes.mjs "${TAG#v}" > /dev/null
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r assets/creator-skill/playpets-creator/requirements.txt
      - run: npm test
        env:
          PLAYPETS_PYTHON: python
      - run: cargo build --release --locked --target ${{ matrix.target }} --manifest-path src-tauri/Cargo.toml
      - name: Assemble unsigned Store package
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: gaerae.PlayPets
          MSIX_PUBLISHER: CN=85817E6E-C9F8-44E1-B251-9010546EC6B8
          MSIX_PUBLISHER_DISPLAY_NAME: gaerae
        run: ./packaging/windows/msix/store.ps1 -Binary src-tauri/target/${{ matrix.target }}/release/playpets.exe -Architecture ${{ matrix.architecture }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: store-${{ matrix.architecture }}
          path: release/store/*.msix
          if-no-files-found: error
          retention-days: 14

  bundle:
    needs: [source, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: store-*
          path: release/store
          merge-multiple: true
      - name: Record the source and package hashes
        env:
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('release/store')
          version = os.environ['TAG'][1:]
          files = [f'PlayPets_{version}_{arch}.msix' for arch in ('x64', 'arm64')]
          record = {'version': version, 'sourceSha': os.environ['SOURCE_SHA'], 'files': files,
                    'sha256': {name: hashlib.sha256((root / name).read_bytes()).hexdigest() for name in files}}
          (root / 'release.json').write_text(json.dumps(record, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('## Unsigned Store packages\n\n```json\n' + json.dumps(record, indent=2) + '\n```\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: store-bundle
          path: release/store/*
          if-no-files-found: error
          retention-days: 14
